<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base" content="__API_BASE__"><title>Memory 工作台</title><link rel="stylesheet" href="__ASSET_BASE__/workbench.css?v=0.13.1"></head>
<body>
<aside class="sidebar"><a class="brand" href="#groups">Memory 工作台</a><nav aria-label="工作台导航">
<button data-page="keys" class="nav-item" id="keysNav" hidden><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="5"/><path d="m12 13 8 8m-5-5 3-3m-6 0 3-3"/></svg>访问密钥</button>
<button data-page="groups" class="nav-item active"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg>记忆组</button>
<button data-page="workspaces" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 7V4h7l3 3h8v14H3Z"/></svg>工作区</button>
<button data-page="events" class="nav-item"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>使用记录</button>
<button data-page="settings" class="nav-item"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 3 1 4 3 1 1 3h4l1-3 3-1 1-4 2-3-2-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg>配置模型</button>
<div class="nav-divider" id="adminSection" hidden>管理</div><button data-page="accounts" class="nav-item" id="adminNav" hidden><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-3a7 7 0 0 1 14 0v3m1-18a4 4 0 0 1 0 8m2 4a6 6 0 0 1 3 6"/></svg>账户管理</button><button data-page="company" class="nav-item" id="companyNav" hidden><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2m4 0h2M8 11h2m4 0h2M10 21v-5h4v5"/></svg>公司模型</button></nav><div class="sidebar-bottom"><button data-page="help" class="nav-item help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 1-1 1-1 3M12 18h.01"/></svg>使用说明</button><div id="userContext" class="user-context" hidden><span id="identity"></span><button id="logout" class="link-button">退出登录</button></div></div></aside>
<main><div id="spaceContext" class="space-context" hidden><label for="spaceSelect">当前密钥空间</label><select id="spaceSelect"></select><a href="#keys">管理密钥</a></div><header><div><h1 id="pageTitle">记忆组</h1><p id="pageDescription" class="page-description"></p></div><div class="toolbar"><button id="refresh" class="button secondary"><svg viewBox="0 0 24 24"><path d="M20 5v6h-6M20 11a8 8 0 1 0-2 7"/></svg>刷新</button><button id="primary" class="button primary">新建记忆组</button></div></header>
<div id="notice" class="notice" role="status" hidden></div><section id="content" aria-live="polite"><p class="empty">正在连接记忆服务…</p></section><footer id="footer">当前查看线上记忆。工作区和会话在 DSH 设置 → 记忆中选择。</footer></main>
<dialog id="editor"><form id="editorForm"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" class="icon-button" aria-label="关闭">×</button></div><div id="fields"></div><p id="dialogError" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancelDialog" class="button secondary">取消</button><button type="submit" id="saveDialog" class="button primary">保存</button></div></form></dialog>
<dialog id="keyDialog"><form method="dialog"><div class="dialog-heading"><h2 id="keyDialogTitle">访问密钥</h2><button class="text-button" aria-label="关闭密钥窗口">关闭</button></div><p>点击“复制密钥”，粘贴到 DSH 插件即可。密钥已加密保存，之后可在访问密钥列表中再次查看、复制。</p><label for="createdKey">完整访问密钥</label><input id="createdKey" type="password" readonly autocomplete="off" spellcheck="false"><label class="check"><input id="revealKey" type="checkbox">显示密钥</label><div class="dialog-actions"><button id="copyKey" type="button" class="button primary">复制密钥</button><button class="button secondary">已保存，关闭</button></div><p id="copyStatus" role="status"></p></form></dialog>
<dialog id="deleteDialog"><form id="deleteForm"><h2>删除访问密钥</h2><p id="deleteDescription"></p><p>密钥将立即失效，DSH 插件不能再用它连接。空间内已有记忆保留，新密钥不会自动继承。</p><p id="deleteError" role="alert" class="error"></p><div class="dialog-actions"><button id="cancelDelete" type="button" class="button secondary">取消</button><button type="submit" class="button danger">确认删除</button></div></form></dialog>
<script type="module" src="__ASSET_BASE__/workbench.js?v=0.13.1"></script></body></html>
